<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>بیت: شعر فارسی بر پایهٔ گنجور</title>
    <meta name="description" content="بیت، برنامهٔ مستقل و غیررسمی خواندن شعر فارسی بر پایهٔ داده&zwnj;های باز و API عمومی گنجور: خوانش، معنی هر بیت، جستجو بر پایهٔ معنا و خواندن آفلاین. ساختهٔ گنجور نیست." />
    <meta name="theme-color" content="#f4eedf" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1330" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/beyt-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/beyt-192.png" />
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/beyt-mark.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply saved reading preferences before first paint.
      try {
        var s = JSON.parse(localStorage.getItem('beyt:settings') || '{}')
        var r = document.documentElement
        if (s.theme === 'light' || s.theme === 'dark') r.setAttribute('data-theme', s.theme)
        if (s.fontSize) r.style.setProperty('--font-size-poem', s.fontSize + 'px')
        if (s.lineHeight) r.style.setProperty('--poem-lh', s.lineHeight)
        if (typeof s.poemFont === 'string') r.setAttribute('data-poem-font', s.poemFont)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>برای خواندن بیت جاوااسکریپت لازم است.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
